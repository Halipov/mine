name: Сборка лаунчера

# Раздачей занимается наш сервер, а не GitHub, поэтому здесь только сборка.
# Нужна она в первую очередь ради macOS: .app с Windows не собрать,
# а ad-hoc подпись требует настоящей macOS.
#
# Готовые файлы приезжают артефактами запуска. Скачал, распаковал в dist/
# проекта лаунчера — и дальше в серверном проекте:
#   npm run publish-launcher
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npx electron-builder ${{ matrix.flag }} --publish never

      # Несогласованная подпись обнаруживается только при запуске: приложение
      # падает в dyld, не дойдя до своего кода. Ловим это здесь, а не на
      # чужом макбуке.
      # Проверяем не папку сборки, а тот самый архив, который уедет друзьям:
      # бандл ломается и при упаковке-распаковке, если теряются симлинки
      # фреймворков или бит исполнения. Такую поломку видно только после
      # round-trip, и до сих пор она доезжала до чужого макбука.
      - name: Проверить архив macOS так, как его получит игрок
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail

          zip=$(ls dist/*-mac-arm64.zip)
          echo "== архив: $zip"

          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          ditto -x -k "$zip" "$unpacked"

          app="$unpacked/Mine Launcher.app"
          [ -d "$app" ] || { echo "в архиве нет .app" >&2; exit 1; }

          echo "== симлинки фреймворков на месте?"
          find "$app/Contents/Frameworks" -maxdepth 4 -type l | head -5
          test -n "$(find "$app/Contents/Frameworks" -maxdepth 4 -type l)" \
            || { echo "симлинки потерялись при упаковке" >&2; exit 1; }

          echo "== подпись"
          codesign --verify --deep --strict --verbose=2 "$app"

          echo "== запуск"
          "$app/Contents/MacOS/Mine Launcher" --selftest

      - uses: actions/upload-artifact@v5
        with:
          name: MineLauncher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
