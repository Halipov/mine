name: Сборка лаунчера

# Раздачей занимается наш сервер, а не GitHub, поэтому здесь только сборка.
# Нужна она в первую очередь ради macOS: .app и .dmg с Windows не собрать,
# а ad-hoc подпись требует настоящей macOS.
#
# Готовые файлы приезжают артефактами запуска. Скачал, распаковал в dist/
# проекта лаунчера — и дальше в серверном проекте:
#   npm run publish-launcher
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npx electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
