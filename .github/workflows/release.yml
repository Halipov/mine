name: Сборка лаунчера

# Windows-инсталлятор и macOS-бандл собираются на своих раннерах:
# .app и .dmg с чужой платформы собрать нельзя, да и ad-hoc подпись
# требует настоящей macOS.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Запуск по тегу v* — это выпуск версии: собираем и кладём в релиз,
      # откуда лаунчер у друзей увидит обновление.
      - name: Собрать и выложить в релиз
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ручной запуск — просто проверка, что всё собирается. Релиз при этом
      # трогать нельзя: иначе кнопка «Run workflow» молча создавала бы черновик.
      - name: Собрать без публикации
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Приложить сборку к запуску
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MineLauncher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
