appId: com.minelauncher.app
productName: Mine Launcher
copyright: Личный проект, не для распространения

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

# Имена совпадают с тем, что ищет самообновление в updater.ts.
artifactName: MineLauncher-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

mac:
  category: public.app-category.games
  # Только arm64: Intel-маки — машины до 2020 года, поддержка удваивала бы
  # вес каждой сборки ради тех, у кого их нет.
  #
  # Оба формата нужны, и каждый за своим:
  #   zip — из него лаунчер ставит обновление сам;
  #   dmg — им ставят руками. Внутри .app символические ссылки и биты
  #         исполнения; распаковщик, который их теряет, оставляет
  #         нерабочую папку и невнятное «не удаётся открыть программу».
  #         В образе диска ломаться нечему — перетащил и всё.
  target:
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
  # Сертификата Apple Developer нет, поэтому обычную подпись отключаем,
  # а вместо неё в afterPack ставим ad-hoc — без неё приложение на Apple
  # Silicon просто не запустится.
  identity: null
  gatekeeperAssess: false

afterPack: ./scripts/adhoc-sign.cjs

# Блока publish здесь намеренно нет. Локальной сборке он не нужен, а на
# GitHub Actions electron-builder определит репозиторий по .git/config
# рабочей копии. Прописанный здесь провайдер без owner/repo ломает сборку
# на машине, где ещё нет git-remote.
